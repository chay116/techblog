<svg viewBox="0 0 980 340" role="img" aria-label="GPU memory hierarchy stack" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-mem-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#164ea6"/>
    </marker>
  </defs>
  <rect x="300" y="20" width="380" height="58" rx="18" fill="#fff0f0" stroke="#b94141" stroke-width="2"/>
  <rect x="260" y="98" width="460" height="60" rx="18" fill="#fff7ea" stroke="#b7791f" stroke-width="2"/>
  <rect x="220" y="178" width="540" height="62" rx="18" fill="#eefaf5" stroke="#2b7a4b" stroke-width="2"/>
  <rect x="180" y="260" width="620" height="62" rx="18" fill="#eef6ff" stroke="#164ea6" stroke-width="2"/>
  <path d="M 490 78 L 490 98" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-mem-a)"/>
  <path d="M 490 158 L 490 178" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-mem-a)"/>
  <path d="M 490 240 L 490 260" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-mem-a)"/>
  <text x="490" y="45" text-anchor="middle" font-size="23" font-weight="700" fill="#1f1f1f">Registers</text>
  <text x="490" y="66" text-anchor="middle" font-size="15" fill="#444">smallest, hottest, private state</text>
  <text x="490" y="123" text-anchor="middle" font-size="23" font-weight="700" fill="#1f1f1f">Shared Memory / L1</text>
  <text x="490" y="145" text-anchor="middle" font-size="15" fill="#444">programmable staging and short-range reuse</text>
  <text x="490" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#1f1f1f">L2 Cache</text>
  <text x="490" y="226" text-anchor="middle" font-size="15" fill="#444">last major on-chip rescue before off-chip traffic</text>
  <text x="490" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#1f1f1f">DRAM</text>
  <text x="490" y="308" text-anchor="middle" font-size="15" fill="#444">largest and farthest storage, where latency and waste become expensive</text>
</svg>
