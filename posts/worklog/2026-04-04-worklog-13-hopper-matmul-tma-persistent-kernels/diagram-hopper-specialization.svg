<svg viewBox="0 0 980 320" role="img" aria-label="Hopper producer consumer specialization" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-hop-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#164ea6"/>
    </marker>
    <marker id="arrow-hop-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5a00"/>
    </marker>
  </defs>

  <rect x="40" y="118" width="170" height="74" rx="18" fill="#f5f7fb" stroke="#164ea6" stroke-width="2"/>

  <rect x="260" y="34" width="180" height="64" rx="18" fill="#fffdf2" stroke="#7a5a00" stroke-width="2"/>
  <rect x="260" y="34" width="180" height="64" rx="18" fill="#ffeeb5" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.26;0.08;0.08" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="260" y="212" width="180" height="64" rx="18" fill="#fffdf2" stroke="#7a5a00" stroke-width="2"/>
  <rect x="260" y="212" width="180" height="64" rx="18" fill="#ffeeb5" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.08;0.26;0.08" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="500" y="118" width="190" height="74" rx="18" fill="#eefaf5" stroke="#2b7a4b" stroke-width="2"/>
  <rect x="500" y="118" width="190" height="74" rx="18" fill="#dff8e8" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.24;0.1;0.24;0.1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="760" y="118" width="170" height="74" rx="18" fill="#fff0f0" stroke="#b94141" stroke-width="2"/>
  <rect x="760" y="118" width="170" height="74" rx="18" fill="#ffd9d9" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.08;0.08;0.28;0.08" dur="6s" repeatCount="indefinite"/>
  </rect>

  <path d="M 210 155 L 260 66" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-hop-a)"/>
  <path d="M 210 155 L 260 244" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-hop-a)"/>
  <path d="M 440 66 L 500 140" stroke="#7a5a00" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-hop-b)"/>
  <path d="M 440 244 L 500 170" stroke="#7a5a00" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-hop-b)"/>
  <path d="M 690 155 L 760 155" stroke="#164ea6" stroke-width="3" marker-end="url(#arrow-hop-a)"/>

  <g>
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#164ea6">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M 210 155 L 260 66 L 440 66 L 500 140 L 690 155 L 760 155"/>
    </rect>
  </g>
  <g>
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#7a5a00">
      <animateMotion dur="4.8s" begin="1.2s" repeatCount="indefinite" path="M 210 155 L 260 244 L 440 244 L 500 170 L 690 155 L 760 155"/>
    </rect>
  </g>
  <g opacity="0.8">
    <circle r="5" fill="#2b7a4b">
      <animateMotion dur="4.8s" begin="2.2s" repeatCount="indefinite" path="M 500 155 H 690"/>
    </circle>
  </g>

  <text x="125" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#1f1f1f">Global / L2</text>
  <text x="125" y="168" text-anchor="middle" font-size="15" fill="#444">large tiles waiting to move</text>

  <text x="350" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#4d3a00">Producer WG</text>
  <text x="350" y="82" text-anchor="middle" font-size="14" fill="#5d4a10">TMA, descriptors, staging</text>

  <text x="350" y="239" text-anchor="middle" font-size="18" font-weight="700" fill="#4d3a00">Producer WG</text>
  <text x="350" y="260" text-anchor="middle" font-size="14" fill="#5d4a10">next tile arrives early</text>

  <text x="595" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#1f1f1f">Shared Memory Buffer</text>
  <text x="595" y="168" text-anchor="middle" font-size="15" fill="#444">movement and compute meet here</text>

  <text x="845" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#1f1f1f">Consumer WG</text>
  <text x="845" y="168" text-anchor="middle" font-size="15" fill="#444">WGMMA / accumulators / issue</text>
</svg>
