<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaeyoung Lim</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="site-head">
        <h1>Chaeyoung Lim</h1>
        <p class="subtitle">Worklog and research notes on GPU optimization, graphics APIs, and systems engineering.</p>
        <nav class="nav-tabs" id="nav-tabs">
          <a href="./index.html" class="nav-tab active" data-nav="home">Home</a>
          <a href="./index.html?series=gpu&category=all" class="nav-tab" data-nav="gpu">GPU</a>
          <a href="./index.html?series=compiler&category=all" class="nav-tab" data-nav="compiler">Compiler</a>
        </nav>
        <p class="links">
          <a href="https://www.linkedin.com/in/chaeyoung-lim-6b0046132/" target="_blank" rel="noreferrer">LinkedIn</a>
          <span>·</span>
          <a href="https://github.com/chay116" target="_blank" rel="noreferrer">GitHub</a>
          <span>·</span>
          <a href="mailto:chay116@naver.com">Naver Email</a>
        </p>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <details class="filter-box" id="filter-details" open>
            <summary id="filter-summary">Filter posts</summary>
            <div class="filter-body">
              <h3 id="filter-search-label">Search</h3>
              <input id="search-input" class="search" type="search" placeholder="Search title, summary, tags..." />

              <h3 id="filter-category-label">Category</h3>
              <div id="category-filters" class="chips"></div>

              <h3 id="filter-track-label">Track</h3>
              <div id="track-filters" class="chips"></div>

              <h3 id="filter-tags-label">Tags</h3>
              <div id="tag-filters" class="chips"></div>

              <button id="clear-btn" class="clear-btn" type="button">Clear filters</button>
            </div>
          </details>
        </aside>

        <section class="main-col">
          <section class="series-row">
            <span class="label" id="series-label">Series</span>
            <div class="chips" id="series-filters"></div>
          </section>

          <section class="mode-row">
            <span class="label" id="lang-label">Language</span>
            <div class="mode-switch" id="lang-switch"></div>
          </section>

          <section class="post-section">
            <h2 id="mode-title">English</h2>
            <p class="count" id="meta"></p>
            <div id="post-list" class="post-list"></div>
          </section>
        </section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
