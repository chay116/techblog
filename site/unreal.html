<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unreal Summary</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("blog_theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="top-controls">
      <div class="theme-control">
        <label class="theme-switch" for="theme-toggle">
          <input id="theme-toggle" class="theme-toggle" type="checkbox" role="switch" aria-label="Toggle dark mode" />
          <span class="theme-track">
            <span class="theme-icon sun" aria-hidden="true">&#9728;</span>
            <span class="theme-thumb" aria-hidden="true"></span>
            <span class="theme-icon moon" aria-hidden="true">&#9790;</span>
          </span>
        </label>
      </div>
    </div>

    <main class="page">
      <header class="site-head">
        <h1>Unreal Summary</h1>
        <p class="subtitle">Folder-tree navigation for Unreal Engine notes.</p>
        <nav class="nav-tabs" id="nav-tabs"></nav>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <section class="filter-box">
            <div class="filter-body">
              <h3>Search</h3>
              <input id="search-input" class="search" type="search" placeholder="Search title, summary, tags..." />

              <h3>Tree</h3>
              <div id="tree" class="tree"></div>
            </div>
          </section>
        </aside>

        <section class="main-col">
          <section class="post-section">
            <h2 id="dir-title">Tracks</h2>
            <p class="count" id="meta"></p>
            <div id="post-list" class="post-list"></div>
          </section>
        </section>
      </div>
    </main>

    <script src="./theme.js"></script>
    <script src="./nav.js"></script>
    <script src="./unreal.js"></script>
  </body>
</html>
