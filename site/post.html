<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("blog_theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <link
      id="hljs-theme-light"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css"
    />
    <link
      id="hljs-theme-dark"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css"
      disabled
    />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  </head>
  <body>
    <div class="top-controls">
      <div class="lang-control" id="lang-switch" aria-label="Language switch"></div>
      <div class="theme-control">
        <label class="theme-switch" for="theme-toggle">
          <input id="theme-toggle" class="theme-toggle" type="checkbox" role="switch" aria-label="Toggle dark mode" />
          <span class="theme-track">
            <span class="theme-icon sun" aria-hidden="true">&#9728;</span>
            <span class="theme-thumb" aria-hidden="true"></span>
            <span class="theme-icon moon" aria-hidden="true">&#9790;</span>
          </span>
        </label>
      </div>
    </div>

    <header class="hero">
      <nav class="nav-tabs" id="nav-tabs"></nav>
      <h1 id="title">Loading...</h1>
      <p id="meta" class="sub"></p>
      <p><a id="back-link" href="./index.html">Back to index</a></p>
    </header>

    <main class="layout single">
      <article class="content">
        <div id="markdown" class="markdown"></div>
        <nav id="chapter-nav" class="chapter-nav" hidden>
          <a id="chapter-prev" href="#" hidden>&larr; Previous Chapter</a>
          <a id="chapter-toc" href="#">Table of Contents</a>
          <a id="chapter-next" href="#" hidden>Next Chapter &rarr;</a>
        </nav>
        <hr />
        <p><a id="github-link" href="#" target="_blank" rel="noreferrer">Open on GitHub</a></p>
      </article>
    </main>

    <script src="./theme.js"></script>
    <script src="./nav.js"></script>
    <script src="./post.js"></script>
  </body>
</html>
